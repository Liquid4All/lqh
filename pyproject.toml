[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lqh"
version = "0.17.0"
description = "LQH – customize Liquid AI foundation models into task-specific models."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "Liquid AI", email = "hello@liquid.ai" },
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "prompt_toolkit>=3.0",
    "rich>=13.0",
    # <3 because the in-band error check in lqh/client.py leans on the SDK's
    # lenient response parsing (extra fields kept as plain values, missing
    # completion fields tolerated); a new major could change that contract.
    "openai>=2.0,<3",
    "httpx>=0.27",
    "liquidrandom",
    "datasets",
    "huggingface_hub>=0.20",
    # Submit-time token counting for the data-derived SFT sequence length
    # (lqh/train/seq_length.py). The Rust wheel alone — no transformers.
    "tokenizers>=0.20",
    "pyarrow",
    # Image preprocessing for VLM data-gen (resize/re-encode before base64).
    "pillow>=10.0",
    # Direct dependency: used for PEP 440 comparisons in the update checker.
    "packaging>=24.0",
]

[project.optional-dependencies]
train = [
    # 2.13 is the torch the vLLM 0.27.1 (grpo image) and sglang 0.5.18
    # (inference/eval images) bases ship, so every image and the laptop run
    # one torch. [tool.uv] below pins the lock to 2.13.0 exactly; the range
    # here is what pip users get.
    "torch>=2.13,<2.15",
    # Lfm2VlImageProcessor (LFM2.5-VL) requires torchvision at processor
    # load time — keep it version-paired with torch (0.28 <-> 2.13).
    "torchvision>=0.28",
    # 5.16: current. 5.15 removed lfm2_vl's own prepare_inputs_for_generation;
    # LFM2.5-VL generate() is validated by tests/function/test_vlm_training_e2e.py
    # and lqh/train/vlm_data.py's drop-and-retry stays as the safety net. The
    # eval/inference images inherit sglang's transformers (5.12.1), so shared
    # code (load_model, merge_lora, lqh/infer) must work on both.
    "transformers>=5.16,<5.17",
    # 1.12: SFT labels/truncation are built in _prepare_dataset, loss_type
    # defaults to chunked_nll, assistant_only_loss is still refused for
    # vision datasets. The VLM path (custom VLMCollator + dataset_kwargs=
    # {"skip_prepare_dataset"}) is honoured because the 1.7+ guard only fires
    # for TRL's own collator. Same TRL as the grpo image (vllm extra caps at
    # 0.27.1).
    "trl>=1.12,<1.13",
    "peft>=0.20",
    # Constrained JSON-schema decoding for local eval; integrates with HF
    # transformers via prefix_allowed_tokens_fn. Pure Python, small.
    # NOTE: lm-format-enforcer ≤0.11.3 ships a broken transformers shim that
    # imports ``PreTrainedTokenizerBase`` from the v4 path. We work around it
    # in ``lqh/infer/__main__.py`` so any version compatible with v5 works.
    "lm-format-enforcer>=0.11",
]

# Resolve the lock to the exact torch the Modal bases ship (see the train
# extra) instead of the newest release; uv sync --frozen in CI then matches
# the cloud images.
[tool.uv]
constraint-dependencies = ["torch==2.13.0", "torchvision==0.28.0"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests/unit"]
asyncio_mode = "auto"
xfail_strict = true
markers = [
    "integration: tests that hit api.lqh.ai (require LQH_DEBUG_API_KEY or ~/.lqh/config.json)",
    "gpu: tests that require a CUDA GPU and optional [train] deps",
    "slow: long-running tests",
    "ambient_hf_token: opt out of the fixture that hides the machine's HF token",
]

[project.urls]
Homepage = "https://liquid.ai"

[project.scripts]
lqh = "lqh.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["lqh"]

# Scope the sdist to the package so untracked working-tree dirs (local
# projects, scratch data) are never swept into the tarball — some contain
# absolute symlinks that break the build. pyproject.toml and the README are
# always included by hatchling for metadata.
[tool.hatch.build.targets.sdist]
only-include = ["lqh", "README.md"]
